<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lebenslauf-Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root {
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, .12);
    --accent-line: rgba(37, 99, 235, .4);
    --ui-accent: #4f46e5;
    --ui-accent-soft: #eef2ff;
    --bg: #eef1f6;
    --panel: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .07);
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

.topbar {
    height: 58px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 20;
}

.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, var(--ui-accent), #7c3aed);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; flex-shrink: 0;
}
.brand h1 { font-size: 1rem; margin: 0; white-space: nowrap; }
.brand span { font-size: .72rem; color: var(--muted); display: block; margin-top: 1px; }

.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); background: #fff; color: var(--text);
    border-radius: 8px; padding: 7px 12px; font-size: .84rem; font-weight: 600;
    cursor: pointer; transition: background .15s, border-color .15s, box-shadow .15s, transform .1s;
    font-family: inherit; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: #cbd5e1; background: #f8fafc; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--ui-accent); border-color: var(--ui-accent); color: #fff; }
.btn.primary:hover { background: #4338ca; border-color: #4338ca; }
.btn.icon-only { padding: 7px 9px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.divider { width: 1px; height: 24px; background: var(--border); margin: 0 2px; }

.zoom-group {
    display: flex; align-items: center; border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; background: #fff;
}
.zoom-group button {
    border: none; background: transparent; width: 30px; height: 32px;
    cursor: pointer; font-size: 1rem; color: var(--muted); font-family: inherit;
}
.zoom-group button:hover { background: #f1f5f9; color: var(--text); }
.zoom-group .zoom-label { font-size: .78rem; font-weight: 600; min-width: 44px; text-align: center; color: var(--muted); }

.app { display: flex; height: calc(100vh - 58px); overflow: hidden; }

.editor {
    width: 470px; min-width: 380px; overflow-y: auto; padding: 16px;
    border-right: 1px solid var(--border); background: #f8fafc;
}

.panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px; margin-bottom: 16px;
}
.panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
.panel-head h2 { font-size: .95rem; margin: 0; display: flex; align-items: center; gap: 8px; }
.panel-head .btn { padding: 5px 10px; font-size: .78rem; }
.panel-hint { font-size: .75rem; color: var(--muted); margin: -6px 0 0; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: .74rem; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.field input, .field textarea {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    font: inherit; font-size: .88rem; font-weight: 400; color: var(--text);
    background: #fff; transition: border-color .15s, box-shadow .15s;
    width: 100%;
}
.field textarea { resize: vertical; min-height: 54px; }
.field input:focus, .field textarea:focus {
    outline: none; border-color: var(--ui-accent);
    box-shadow: 0 0 0 3px var(--ui-accent-soft);
}
.field input[type="color"] { padding: 3px; height: 36px; cursor: pointer; }

.photo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.photo-thumb {
    width: 44px; height: 54px; border-radius: 8px; object-fit: cover;
    border: 1px solid var(--border); background: #f1f5f9; flex-shrink: 0;
}
.photo-placeholder {
    width: 44px; height: 54px; border-radius: 8px; border: 1px dashed var(--border);
    background: #f8fafc; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted);
}

.check { display: flex; align-items: center; gap: 8px; font-size: .84rem; color: var(--text); cursor: pointer; font-weight: 500; }
.check input { width: 16px; height: 16px; accent-color: var(--ui-accent); cursor: pointer; }

.entry {
    border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px;
    background: #fff; overflow: hidden; transition: box-shadow .15s;
}
.entry:hover { box-shadow: 0 2px 8px rgba(15, 23, 42, .06); }
.entry-head {
    display: flex; align-items: center; gap: 4px; padding: 6px 8px 6px 10px;
    background: #f8fafc; border-bottom: 1px solid transparent; cursor: pointer;
    user-select: none;
}
.entry.open .entry-head { border-bottom-color: var(--border); }
.entry-title { flex: 1; font-size: .82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry-actions { display: flex; align-items: center; gap: 2px; }
.entry-body { padding: 12px; display: grid; gap: 10px; }
.entry:not(.open) .entry-body { display: none; }

.icon-btn {
    border: none; background: transparent; color: var(--muted);
    width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s; flex-shrink: 0; padding: 0;
}
.icon-btn:hover { background: #e2e8f0; color: var(--text); }
.icon-btn.danger:hover { background: #fee2e2; color: #dc2626; }
.icon-btn .chev { transition: transform .2s; }
.entry:not(.open) .icon-btn .chev { transform: rotate(-90deg); }

.sub-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 2px; padding-top: 10px; border-top: 1px dashed var(--border);
}
.sub-head span { font-size: .74rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.sub-head .btn { padding: 4px 9px; font-size: .74rem; }

.sub-entry {
    border: 1px solid var(--border); border-left: 3px solid var(--ui-accent);
    border-radius: 8px; padding: 10px; display: grid; gap: 8px; background: #fcfdfe;
}
.sub-entry .entry-head { padding: 0 0 2px 0; background: transparent; }

.footer-actions { display: flex; gap: 8px; justify-content: center; padding: 4px 0 24px; }

.preview-pane {
    flex: 1; overflow: auto; position: relative;
    background:
        radial-gradient(circle at 1px 1px, rgba(15, 23, 42, .07) 1px, transparent 0);
    background-size: 22px 22px;
    background-color: #e6eaf1;
}

.pages-stack {
    display: flex; flex-direction: column; align-items: center;
    gap: 28px; padding: 36px 24px 80px;
}

.a4-page {
    width: 210mm; height: 297mm; flex-shrink: 0;
    background: #fff; padding: 16mm 15mm;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .14), 0 14px 38px rgba(15, 23, 42, .20);
    border-radius: 2px;
    overflow: hidden;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
}

.pages-stack.anim .a4-page { animation: pageIn .38s ease both; }
.pages-stack.anim .a4-page:nth-child(2) { animation-delay: .06s; }
.pages-stack.anim .a4-page:nth-child(3) { animation-delay: .12s; }
.pages-stack.anim .a4-page:nth-child(n+4) { animation-delay: .18s; }
@keyframes pageIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
}

.page-pill {
    position: sticky; top: 12px; margin-left: auto; margin-right: 16px;
    width: fit-content; z-index: 5;
    background: rgba(15, 23, 42, .82); color: #fff; backdrop-filter: blur(4px);
    font-size: .75rem; font-weight: 600; padding: 5px 12px; border-radius: 999px;
}

.page-content { height: 100%; position: relative; }
.page-content > *:first-child { margin-top: 0 !important; }

.page-content {
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #111827; font-size: 10.5pt; line-height: 1.45;
}

.r-header {
    display: flex; align-items: center; gap: 7mm;
    padding-bottom: 6mm; margin-bottom: 6mm;
    border-bottom: 2.5px solid var(--accent);
    break-inside: avoid; page-break-inside: avoid;
}
.r-photo {
    width: 26mm; height: 32mm; object-fit: cover;
    border-radius: 2.5mm; flex-shrink: 0;
    box-shadow: 0 0 0 1px var(--accent-line);
}
.r-head-main { min-width: 0; }
.r-name { font-size: 22pt; font-weight: 700; margin: 0; color: #111827; letter-spacing: .02em; line-height: 1.15; }
.r-contact { font-size: 9.5pt; color: #374151; margin-top: 1.6mm; }
.r-contact:empty { display: none; }

.r-title {
    font-size: 11.5pt; text-transform: uppercase; letter-spacing: .12em;
    color: var(--accent); font-weight: 700;
    margin: 6.5mm 0 3.2mm; padding-bottom: 1.4mm;
    border-bottom: 1.5px solid var(--accent-line);
    break-after: avoid; page-break-after: avoid;
}
.r-title.page-break-before { break-before: page; page-break-before: always; }

.r-item {
    display: flex; gap: 5mm; margin-bottom: 4.2mm;
    break-inside: avoid; page-break-inside: avoid;
}
.r-date {
    flex: 0 0 31mm; font-weight: 600; color: var(--accent);
    font-size: 9.5pt; padding-top: .5mm; white-space: pre-line;
}
.r-body { flex: 1; min-width: 0; }
.r-item-title { font-weight: 700; color: #111827; font-size: 10.5pt; }
.r-sub { color: #4b5563; font-size: 9.5pt; margin-top: .5mm; }
.r-sub:empty { display: none; }

.r-projects { margin: 1.6mm 0 0; padding-left: 4.5mm; }
.r-projects li { margin-bottom: 1.4mm; font-size: 9.5pt; break-inside: avoid; }
.r-proj-title { font-weight: 600; color: #111827; }
.r-proj-date { color: #6b7280; font-size: 9pt; }
.r-proj-desc { color: #374151; margin-top: .4mm; white-space: pre-line; }

.r-desc { color: #374151; font-size: 9.8pt; margin-top: 1.2mm; white-space: pre-line; }

.r-skill-cat { margin-bottom: 3.5mm; break-inside: avoid; page-break-inside: avoid; }
.r-skill-label { font-weight: 700; font-size: 9.5pt; color: #1f2937; margin-bottom: 1.4mm; }
.r-tags { display: flex; flex-wrap: wrap; gap: 1.6mm; }
.r-tag {
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--accent-line);
    padding: .6mm 2.6mm; border-radius: 999px; font-size: 8.8pt; font-weight: 600;
}

.r-empty {
    height: 100%; display: flex; align-items: center; justify-content: center;
    color: #9ca3af; font-size: 11pt; text-align: center; padding: 0 20mm;
}

.measure-page {
    position: absolute; left: -10000px; top: 0;
    width: 210mm; height: 297mm; padding: 16mm 15mm;
    box-sizing: border-box; visibility: hidden; pointer-events: none;
}

.pages-stack.exporting { gap: 0; padding: 0; display: block; }
.pages-stack.exporting .a4-page {
    box-shadow: none; border-radius: 0; animation: none; margin: 0 auto;
    break-after: page; page-break-after: always;
}
.pages-stack.exporting .a4-page:last-child { break-after: auto; page-break-after: auto; }

@media (max-width: 1024px) {
    .app { flex-direction: column; height: auto; overflow: visible; }
    body { overflow: auto; }
    .editor { width: 100%; min-width: 0; border-right: none; border-bottom: 1px solid var(--border); }
    .preview-pane { min-height: 60vh; }
}

@media print {
    @page { size: A4; margin: 0; }
    html, body { background: #fff; height: auto; overflow: visible; }
    .topbar, .editor, .page-pill, .measure-page { display: none !important; }
    .app { display: block; height: auto; overflow: visible; }
    .preview-pane { overflow: visible; background: none; }
    .pages-stack { zoom: 1 !important; gap: 0; padding: 0; display: block; }
    .a4-page {
        box-shadow: none; border-radius: 0; margin: 0;
        animation: none; break-after: page; page-break-after: always;
    }
    .a4-page:last-child { break-after: auto; page-break-after: auto; }
}
</style>
</head>
<body>

<header class="topbar">
    <div class="brand">
        <div class="brand-mark">CV</div>
        <div>
            <h1>Lebenslauf-Generator</h1>
            <span>Live-Vorschau auf A4-Seiten</span>
        </div>
    </div>
    <div class="toolbar">
        <div class="zoom-group" title="Zoom">
            <button id="zoomOut" title="Verkleinern">&minus;</button>
            <span class="zoom-label" id="zoomLabel">100%</span>
            <button id="zoomIn" title="Vergr&ouml;&szlig;ern">+</button>
        </div>
        <div class="divider"></div>
        <button class="btn icon-only" id="printBtn" title="Drucken (Strg+P)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        </button>
        <button class="btn primary" id="pdfBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            PDF exportieren
        </button>
        <button class="btn" id="xmlExportBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            XML speichern
        </button>
        <button class="btn" id="xmlImportBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            XML &ouml;ffnen
        </button>
    </div>
</header>

<div class="app">
    <aside class="editor" id="editor"></aside>
    <main class="preview-pane" id="previewPane">
        <div class="page-pill" id="pagePill">1 Seite</div>
        <div class="pages-stack" id="pagesStack"></div>
    </main>
</div>

<div class="measure-page" aria-hidden="true">
    <div class="page-content" id="measureContent"></div>
</div>

<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="xmlInput" accept=".xml,text/xml" hidden>

<script>
const STORAGE_KEY = 'lebenslauf-generator-v8';
const uid = () => 'id_' + Math.random().toString(36).slice(2, 10);

function defaultState() {
    return {
        personal: { vorname: '', nachname: '', strasse: '', plz: '', ort: '', telefon: '', email: '', geburtsdatum: '', image: '' },
        experiences: [],
        educations: [],
        personalProjects: [],
        skills: { languages: '', it: '', tools: '' },
        settings: { accent: '#2563eb', breakBeforeEducation: true }
    };
}

let state = defaultState();
let zoom = 1;
let lastPageCount = 0;
const collapsed = new Set();

const I = {
    up: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>',
    down: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    trash: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
    plus: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    chev: '<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    image: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>'
};

function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function escapeXML(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&apos;');
}

function hexToRgb(hex) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(String(hex).trim());
    if (!m) return { r: 37, g: 99, b: 235 };
    return { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) };
}

function setAccent(color) {
    const c = hexToRgb(color);
    const root = document.documentElement.style;
    root.setProperty('--accent', color);
    root.setProperty('--accent-soft', 'rgba(' + c.r + ', ' + c.g + ', ' + c.b + ', 0.16)');
    root.setProperty('--accent-line', 'rgba(' + c.r + ', ' + c.g + ', ' + c.b + ', 0.6)');
}

function setByPath(path, value) {
    const p = path.split('.');
    if (p[0] === 'p') state.personal[p[1]] = value;
    else if (p[0] === 'sk') state.skills[p[1]] = value;
    else if (p[0] === 'st') state.settings[p[1]] = value;
    else if (p[0] === 'exp') state.experiences[+p[1]][p[2]] = value;
    else if (p[0] === 'edu') state.educations[+p[1]][p[2]] = value;
    else if (p[0] === 'pp') state.personalProjects[+p[1]][p[2]] = value;
    else if (p[0] === 'px') {
        const arr = p[1] === 'exp' ? state.experiences[+p[2]].projects : state.educations[+p[2]].projects;
        arr[+p[3]][p[4]] = value;
    }
}

const field = (label, path, value, placeholder, type) =>
    '<label class="field"><span>' + label + '</span>' +
    '<input type="' + (type || 'text') + '" data-path="' + path + '" value="' + esc(value) + '" placeholder="' + esc(placeholder || '') + '"></label>';

const area = (label, path, value, placeholder, rows) =>
    '<label class="field"><span>' + label + '</span>' +
    '<textarea data-path="' + path + '" rows="' + (rows || 3) + '" placeholder="' + esc(placeholder || '') + '">' + esc(value) + '</textarea></label>';

const gap = () => '<div style="height:10px;"></div>';

function projCard(kind, i, j, p) {
    return '<div class="sub-entry">' +
        '<div class="entry-head" style="cursor:default;">' +
            '<span class="entry-title">' + esc(p.title) + '</span>' +
            '<span class="entry-actions">' +
                '<button class="icon-btn" data-act="movep:' + kind + ':' + i + ':' + j + ':up" title="Nach oben">' + I.up + '</button>' +
                '<button class="icon-btn" data-act="movep:' + kind + ':' + i + ':' + j + ':down" title="Nach unten">' + I.down + '</button>' +
                '<button class="icon-btn danger" data-act="delp:' + kind + ':' + i + ':' + j + '" title="L&ouml;schen">' + I.trash + '</button>' +
            '</span>' +
        '</div>' +
        '<div class="grid2">' +
            field('Projektname', 'px.' + kind + '.' + i + '.' + j + '.title', p.title, 'z.B. Smart Home App') +
            field('Zeitraum (optional)', 'px.' + kind + '.' + i + '.' + j + '.date', p.date, 'z.B. Q1 2024') +
        '</div>' +
        area('Beschreibung (optional)', 'px.' + kind + '.' + i + '.' + j + '.desc', p.desc, 'Kurze Beschreibung', 2) +
    '</div>';
}

function collectFlow(root) {
    const flow = [];
    Array.from(root.children).forEach(ch => {
        if (ch.tagName === 'SECTION') {
            Array.from(ch.children).forEach(child => {
                flow.push({
                    el: child,
                    keep: child.classList.contains('r-title'),
                    forced: child.classList.contains('page-break-before')
                });
            });
        } else {
            flow.push({ el: ch, keep: false, forced: false });
        }
    });
    return flow;
}

function paginate(flow, cap) {
    const pages = [];
    let current = [];
    let pageStart = 0;

    flow.forEach((item, idx) => {
        const top = item.el.offsetTop;
        const bottom = top + item.el.offsetHeight;
        const relBottom = bottom - pageStart;
        const needsBreak = current.length > 0 && ((idx > 0 && relBottom > cap) || item.forced);

        if (needsBreak) {
            let carry = null;
            if (current.length && current[current.length - 1].keep) carry = current.pop();
            pages.push(current);
            current = [];
            if (carry) {
                current.push(carry);
                pageStart = carry.el.offsetTop;
            } else {
                pageStart = top;
            }
        }
        current.push(item);
    });
    if (current.length) pages.push(current);
    return pages;
}

function renderPages(pages) {
    const stack = document.getElementById('pagesStack');
    stack.innerHTML = '';

    if (!pages.length) {
        const page = document.createElement('div');
        page.className = 'a4-page';
        page.innerHTML = '<div class="page-content"><div class="r-empty">Dein Lebenslauf erscheint hier.<br>F&uuml;lle das Formular links aus oder lade die Beispieldaten.</div></div>';
        stack.appendChild(page);
        lastPageCount = 0;
        updatePagePill(1);
        return;
    }

    const changed = pages.length !== lastPageCount;
    pages.forEach(items => {
        const page = document.createElement('div');
        page.className = 'a4-page';
        const content = document.createElement('div');
        content.className = 'page-content';
        items.forEach((it, idx) => {
            const clone = it.el.cloneNode(true);
            if (idx === 0) clone.classList.remove('page-break-before');
            content.appendChild(clone);
        });
        page.appendChild(content);
        stack.appendChild(page);
    });

    if (changed) {
        stack.classList.remove('anim');
        void stack.offsetWidth;
        stack.classList.add('anim');
    }
    lastPageCount = pages.length;
    updatePagePill(pages.length);
}

function updatePagePill(n) {
    document.getElementById('pagePill').textContent = n === 1 ? '1 Seite' : n + ' Seiten';
}

function rebuildPreview() {
    const measureContent = document.getElementById('measureContent');
    measureContent.innerHTML = buildResumeHTML();
    const flow = collectFlow(measureContent);
    const cap = measureContent.clientHeight;
    renderPages(paginate(flow, cap));
}

function normalizeState(s) {
    const d = defaultState();
    const withProjects = arr => (arr || []).map(e => {
        const c = Object.assign({}, e, { id: e.id || uid() });
        c.projects = (e.projects || []).map(p => Object.assign({ id: uid() }, p));
        return c;
    });
    return {
        personal: Object.assign({}, d.personal, s.personal || {}),
        experiences: withProjects(s.experiences),
        educations: withProjects(s.educations),
        personalProjects: (s.personalProjects || []).map(e => Object.assign({ id: uid() }, e)),
        skills: Object.assign({}, d.skills, s.skills || {}),
        settings: Object.assign({}, d.settings, s.settings || {})
    };
}

function setZoom(z) {
    zoom = Math.min(1.5, Math.max(0.4, z));
    document.getElementById('pagesStack').style.zoom = zoom;

}

    setZoom(Math.min(1, Math.max(0.4, w / 794)));
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function fileBaseName() {
    const p = state.personal;
    return ([p.nachname, p.vorname].filter(Boolean).join('_') || 'Lebenslauf') + '_Lebenslauf';
}

async function exportPDF() {
    const stack = document.getElementById('pagesStack');
    const pages = Array.from(stack.querySelectorAll('.a4-page'));
    if (!pages.length) return;
    const btn = document.getElementById('pdfBtn');
    btn.disabled = true;
    const prevZoom = zoom;
    stack.style.removeProperty('zoom');
    await sleep(120);
    let ok = false;
    try {
        if (window.html2canvas && window.jspdf) {
            const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
            for (let i = 0; i < pages.length; i++) {
                const canvas = await html2canvas(pages[i], { scale: 3, useCORS: true, backgroundColor: '#ffffff', logging: false });
                const img = canvas.toDataURL('image/png');
                if (i > 0) pdf.addPage();
                pdf.addImage(img, 'PNG', 0, 0, 210, 297);
            }
            pdf.save(fileBaseName() + '.pdf');
            ok = true;
        } else if (window.html2pdf) {
            stack.classList.add('exporting');
            await sleep(120);
            await html2pdf().set({
                margin: 0,
                filename: fileBaseName() + '.pdf',
                image: { type: 'png' },
                html2canvas: { scale: 3, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['css', 'legacy'] }
            }).from(stack).save();
            ok = true;
        }
        if (!ok) throw new Error('PDF-Bibliothek nicht geladen');
    } catch (e) {
        alert('PDF-Export fehlgeschlagen (' + e.message + ').\nBitte nutze den Druckdialog (Drucken-Button), um als PDF zu speichern.');
    } finally {
        stack.classList.remove('exporting');
        setZoom(prevZoom);
        btn.disabled = false;
    }
}

function importXMLFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        try {
            const doc = new DOMParser().parseFromString(e.target.result, 'text/xml');
            if (doc.getElementsByTagName('parsererror').length) throw new Error('Keine g&uuml;ltige XML-Datei'.replace('&uuml;', '\u00fc'));

            const g = (el, tag) => {
                const n = el.getElementsByTagName(tag)[0];
                return n ? n.textContent : '';
            };
            const root = doc.getElementsByTagName('resume')[0] || doc;

            state.personal = {
                vorname: g(root, 'vorname'), nachname: g(root, 'nachname'),
                strasse: g(root, 'strasse'), plz: g(root, 'plz'), ort: g(root, 'ort'),
                telefon: g(root, 'telefon'), email: g(root, 'email'),
                geburtsdatum: g(root, 'geburtsdatum'),
                image: (root.getElementsByTagName('image')[0] ? root.getElementsByTagName('image')[0].textContent : '').trim()
            };

            const readProjects = parent => Array.from(parent.getElementsByTagName('project')).map(p => ({
                id: uid(), title: g(p, 'title'), date: g(p, 'date'), desc: g(p, 'desc')
            }));

            state.experiences = Array.from(root.getElementsByTagName('experience')).map(ex => ({
                id: uid(),
                company: g(ex, 'company'), role: g(ex, 'role'),
                date: g(ex, 'date'), location: g(ex, 'location'),
                projects: readProjects(ex)
            }));

            state.educations = Array.from(root.getElementsByTagName('education')).map(ed => ({
                id: uid(),
                school: g(ed, 'school'), degree: g(ed, 'degree'),
                date: g(ed, 'date'), location: g(ed, 'location'), grade: g(ed, 'grade'),
                projects: readProjects(ed)
            }));

            state.personalProjects = Array.from(root.getElementsByTagName('personalProject')).map(p => ({
                id: uid(),
                title: g(p, 'title'), subtitle: g(p, 'subtitle'),
                date: g(p, 'date'), link: g(p, 'link'), desc: g(p, 'desc')
            }));

            state.skills = {
                languages: g(root, 'languages'),
                it: g(root, 'it'),
                tools: g(root, 'tools')
            };

            collapsed.clear();
            setAccent(state.settings.accent);
            renderEditor();
            rebuildPreview();
            saveLocal();
        } catch (err) {
            alert('Import fehlgeschlagen: ' + err.message);
        }
    };
    reader.readAsText(file);
}

document.getElementById('editor').addEventListener('input', e => {
    const t = e.target;
    const path = t.dataset && t.dataset.path;
    if (!path) return;
    const value = t.type === 'checkbox' ? t.checked : t.value;
    setByPath(path, value);
    if (path === 'st.accent') setAccent(value);
    schedulePreview();
    scheduleSave();
});

document.getElementById('editor').addEventListener('click', e => {
    const head = e.target.closest('.entry-head[data-act^="toggle:"]');
    if (head && !e.target.closest('[data-act^="move"], [data-act^="del"]')) {
        const entry = head.closest('.entry');
        const id = entry ? entry.dataset.id : null;
        if (id) {
            if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
            renderEditor();
        }
        return;
    }
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const parts = btn.dataset.act.split(':');
    const act = parts[0], kind = parts[1], idx = +parts[2], j = +parts[3], dir = parts[4];

    if (act === 'photo') {
        document.getElementById('photoInput').click();
        return;
    }
    if (act === 'photo-del') {
        state.personal.image = '';
        renderEditor();
        schedulePreview();
        scheduleSave();
        return;
    }
    if (act === 'demo') {
        if (confirm('Beispieldaten laden? Die aktuellen Eingaben werden ersetzt.')) loadDemo();
        return;
    }
    if (act === 'reset') {
        if (confirm('Wirklich alle Eingaben l\u00f6schen?')) {
            state = defaultState();
            collapsed.clear();
            renderEditor();
            rebuildPreview();
            saveLocal();
        }
        return;
    }

    const list = kind === 'exp' ? state.experiences : kind === 'edu' ? state.educations : state.personalProjects;

    if (act === 'add') {
        if (kind === 'exp') state.experiences.unshift({ id: uid(), company: '', role: '', date: '', location: '', projects: [] });
        else if (kind === 'edu') state.educations.unshift({ id: uid(), school: '', degree: '', date: '', location: '', grade: '', projects: [] });
        else state.personalProjects.unshift({ id: uid(), title: '', subtitle: '', date: '', link: '', desc: '' });
    } else if (act === 'del') {
        list.splice(idx, 1);
    } else if (act === 'move') {
        const t = dir === 'up' ? idx - 1 : idx + 1;
        if (t >= 0 && t < list.length) {
            const tmp = list[idx];
            list[idx] = list[t];
            list[t] = tmp;
        }
    } else if (act === 'addp') {
        list[idx].projects.push({ id: uid(), title: '', date: '', desc: '' });
    } else if (act === 'delp') {
        list[idx].projects.splice(j, 1);
    } else if (act === 'movep') {
        const arr = list[idx].projects;
        const t = dir === 'up' ? j - 1 : j + 1;
        if (t >= 0 && t < arr.length) {
            const tmp = arr[j];
            arr[j] = arr[t];
            arr[t] = tmp;
        }
    } else {
        return;
    }

    renderEditor();
    schedulePreview();
    scheduleSave();
});

document.getElementById('photoInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        state.personal.image = ev.target.result;
        renderEditor();
        schedulePreview();
        scheduleSave();
    };
    reader.readAsDataURL(file);
    e.target.value = '';
});

document.getElementById('xmlInput').addEventListener('change', e => {
    importXMLFile(e.target.files[0]);
    e.target.value = '';
});

document.getElementById('xmlImportBtn').addEventListener('click', () => document.getElementById('xmlInput').click());
document.getElementById('xmlExportBtn').addEventListener('click', exportXML);
document.getElementById('pdfBtn').addEventListener('click', exportPDF);
document.getElementById('printBtn').addEventListener('click', () => window.print());
document.getElementById('zoomIn').addEventListener('click', () => setZoom(zoom + 0.1));
document.getElementById('zoomOut').addEventListener('click', () => setZoom(zoom - 0.1));

window.addEventListener('resize', () => {
    clearTimeout(window.__rz);
    window.__rz = setTimeout(() => rebuildPreview(), 200);
});

(function init() {
    const saved = loadLocal();
    if (saved) state = saved;
    setAccent(state.settings.accent);
    renderEditor();
    fitZoom();
    rebuildPreview();
})();
</script>
